printWidth: 100
singleQuote: true
trailingComma: es5
arrowParens: avoid

plugins: ['@trivago/prettier-plugin-sort-imports']

# Order project imports from lower-level utilities toward UI consumers.
importOrder:
  [
    '\.css$',
    '<THIRD_PARTY_MODULES>',
    '^@/lib/',
    '^@/components/',
    '^@shared/',
    '^@/pages/',
    '^@/',
    '^[./]',
  ]
importOrderSeparation: true
importOrderSortSpecifiers: true
